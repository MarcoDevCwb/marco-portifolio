<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurora Login — Fundo animado contínuo</title>
<meta name="description" content="Login com fundo em gradiente animado continuamente via CSS @property, orbs com parallax de mouse e micro-interações no formulário.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237c5cff'/%3E%3Cstop offset='1' stop-color='%23ff5ca8'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='%2307070c'/%3E%3Ccircle cx='16' cy='16' r='9' fill='url(%23g)'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <a class="back-link" href="../../index.html">← Catálogo</a>


  <div class="aurora">
    <span class="orb orb-1"></span>
    <span class="orb orb-2"></span>
    <span class="orb orb-3"></span>
  </div>

  <main class="stage">
    <form class="card" id="login-form" novalidate>
      <h1>Bem-vindo de volta</h1>
      <p class="subtitle">Entre com sua conta para continuar</p>

      <label class="field">
        <span>Email</span>
        <input type="email" name="email" autocomplete="email" placeholder="voce@empresa.com" required>
      </label>

      <label class="field">
        <span>Senha</span>
        <input type="password" name="password" autocomplete="current-password" placeholder="••••••••" required minlength="6">
      </label>

      <button type="submit" class="submit">
        <span class="label">Entrar</span>
        <span class="spinner" aria-hidden="true"></span>
      </button>

      <p class="hint">Dica: envie o formulário vazio ou com senha curta para ver a animação de erro.</p>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
