<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magnetic Button — Atração magnética + pulso contínuo</title>
<meta name="description" content="Botão com atração magnética ao cursor, anéis de pulso contínuo e borda giratória via conic-gradient.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237c5cff'/%3E%3Cstop offset='1' stop-color='%23ff5ca8'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='%230b0b12'/%3E%3Ccircle cx='16' cy='16' r='9' fill='url(%23g)'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <a class="back-link" href="../../index.html">← Catálogo</a>

  <main class="stage">
    <p class="hint">Aproxime o cursor dos botões abaixo</p>

    <div class="row">
      <button class="magnetic pulse" data-strength="35">
        <span class="magnetic-inner">Contratar agora</span>
      </button>

      <button class="magnetic spin-border" data-strength="25">
        <span class="magnetic-inner">Ver portfólio</span>
      </button>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
